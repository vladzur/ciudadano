name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build -t southamerica-east1-docker.pkg.dev/villarrica-denuncia-ciudadana/api/api:${{ github.sha }} -f apps/api/Dockerfile .
          docker push southamerica-east1-docker.pkg.dev/villarrica-denuncia-ciudadana/api/api:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ciudadano-api \
            --image southamerica-east1-docker.pkg.dev/villarrica-denuncia-ciudadana/api/api:${{ github.sha }} \
            --region southamerica-east1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DB_HOST=${{ secrets.DB_HOST }},DB_NAME=${{ secrets.DB_NAME }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},GCS_BUCKET=${{ secrets.GCS_BUCKET }},GCS_PROJECT_ID=villarrica-denuncia-ciudadana,JWT_SECRET=${{ secrets.JWT_SECRET }}"
